<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="slider">
        <div class="slides">
            <img class="slide" src="naruto.jpg" alt="Image number #1" width="200px" height="200px">
            <img class="slide" src="sasuke.jpg" alt="Image number #2" width="400px" height="200px">
            <img class="slide" src="sakura.jpg" alt="Image number #3" width="400px" height="200px">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
